name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornermaximo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cornermaximo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cornermaximo
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cornermaximo
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit legacy brand residues
        shell: bash
        run: |
          set -euo pipefail
          legacy='fut''stats'
          if grep -RniI --exclude-dir=.git --exclude='*.map' "$legacy" .; then
            echo "::error::Se encontraron referencias residuales de la marca anterior."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: |
          npm run db:generate
          npm run db:validate

      - name: Prepare ephemeral database
        run: npm run db:push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web application
        run: npm run build -w web

      # Las vulnerabilidades HIGH restantes pertenecen a dependencias internas
      # de Next 15 y requieren una migración mayor a Next 16. Mientras se valida
      # esa migración, ninguna vulnerabilidad CRITICAL puede entrar en main.
      - name: Audit critical production dependencies
        run: npm audit --omit=dev --audit-level=critical
