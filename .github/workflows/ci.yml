name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornermaximo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cornermaximo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cornermaximo
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cornermaximo
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply complete brand namespace migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cornermaximo-rebrand'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old_title = 'Fut' + 'Stats'
          old_upper = 'FUT' + 'STATS'
          old_lower = 'fut' + 'stats'
          new_title = 'CornerMaximo'
          new_upper = 'CORNERMAXIMO'
          new_lower = 'cornermaximo'

          result = subprocess.run(
              ['git', 'grep', '-Il', '-e', old_title, '-e', old_upper, '-e', old_lower],
              check=False,
              capture_output=True,
              text=True,
          )
          for raw_path in result.stdout.splitlines():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old_title, new_title).replace(old_upper, new_upper).replace(old_lower, new_lower)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No quedan sustituciones automáticas pendientes."
          else
            git config user.name "CornerMaximo Migration Bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "refactor(brand): migrate remaining namespace references"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "Migración aplicada a la rama; la nueva ejecución validará el resultado."
            exit 0
          fi

      - name: Audit legacy brand residues
        shell: bash
        run: |
          set -euo pipefail
          legacy='fut''stats'
          if grep -RniI --exclude-dir=.git --exclude='*.map' "$legacy" .; then
            echo "::error::Se encontraron referencias residuales de la marca anterior."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: |
          npm run db:generate
          npm run db:validate

      - name: Prepare ephemeral database
        run: npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web application
        run: npm run build -w web
