name: Rename Vercel project

on:
  push:
    branches: [agent/cornermaximo-rebrand]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename project to CornerMaximo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_Mt5txGIcAO6qik4EV90ajIwPmQTd
          TEAM_ID: team_vi6hOB1X9ewHjZhOz2MqFMwR
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN no está configurado en GitHub Actions."
            exit 2
          fi
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${TEAM_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"name":"cornermaximo"}')
          cat "$response_file"
          echo
          if [[ "$status" != 2* ]]; then
            echo "::error::Vercel respondió HTTP $status al intentar renombrar el proyecto."
            exit 1
          fi
          echo "Proyecto Vercel renombrado correctamente."
