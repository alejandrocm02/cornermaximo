# GitHub Actions llama al endpoint protegido de la app en Vercel.
# Cada invocación inicia trabajo durante ~35s y reserva margen frente al límite
# de 60s de la función. También respeta el rate
# limit del proveedor y el presupuesto diario configurado en la app.
# Hasta 8 tandas por hora (antes 10): 20% menos invocaciones máximas
# programadas en Vercel. Las unidades pendientes continúan en la siguiente tanda.
name: sync

on:
  schedule:
    # Respaldo. La sincronización horaria la lanza Supabase con pg_cron
    # (supabase/migrations/20261008181500_hourly_sync_cron.sql) en los minutos
    # 17, 27 y 37: GitHub descartaba la mayoría de ejecuciones programadas y el
    # cron horario corría en la práctica 3-4 veces al día. Este respaldo cada
    # 6 h, en el minuto 52, cubre una caída de pg_cron y queda lejos de sus tandas.
    - cron: '52 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Una sincronización nueva espera a que termine la anterior. Cancelar una tanda
# a mitad podría dejar unidades pendientes y desperdiciar presupuesto de la API.
concurrency:
  group: cornermaximo-production-sync
  cancel-in-progress: false

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      # El dominio canónico es público. Mantenerlo como secreto provocó deriva
      # de configuración y respuestas 404 en todas las ejecuciones programadas.
      APP_URL: https://cornermaximo.es
    steps:
      - name: Validar configuración segura
        shell: bash
        run: |
          set -euo pipefail
          if [ ${#SYNC_SECRET} -lt 32 ]; then
            echo "::error::SYNC_SECRET debe tener al menos 32 caracteres."
            exit 1
          fi
          if [[ "$APP_URL" != "https://cornermaximo.es" ]]; then
            echo "::error::APP_URL no coincide con el dominio canónico de producción."
            exit 1
          fi

      - name: Ejecutar tandas de sincronización
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 8); do
            echo "--- tanda $i ---"

            if ! RESP=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --max-time 55 \
              -X POST \
              -H "Authorization: Bearer $SYNC_SECRET" \
              -H "Content-Type: application/json" \
              "$APP_URL/api/admin/sync/run" \
              -d '{"maxRequests":200}'); then
              echo "::error::El endpoint de sincronización devolvió un error HTTP o agotó el tiempo máximo."
              exit 1
            fi

            echo "$RESP"
            # Una unidad fallida no detiene la cola, pero debe verse en la
            # ejecución: antes un proveedor caído pasaba días en verde.
            if [[ "$RESP" != *'"failed":[]'* ]]; then
              echo "::warning::La tanda $i terminó con unidades fallidas; revisa /admin/sincronizacion."
            fi
            case "$RESP" in
              *'"stopped":"completed"'*)
                echo "Todo sincronizado."
                break
                ;;
              *'"stopped":"budget_exhausted"'*)
                echo "::warning::Presupuesto diario de la API agotado."
                break
                ;;
            esac

            sleep 10
          done
