# GitHub Actions llama al endpoint protegido de la app en Vercel.
# Cada invocación trabaja ~45s (límite de Vercel Hobby) y respeta el rate
# limit del plan Pro de API-Football (300 req/min, 7 500 req/día), así que
# encadenamos varias tandas por ejecución. Corre cada hora: con el Mundial
# 2026 en juego interesa refrescar resultados y clasificación con frecuencia.
name: sync

on:
  schedule:
    - cron: '0 * * * *' # cada hora
  workflow_dispatch: {}

permissions:
  contents: read

# Una sincronización nueva espera a que termine la anterior. Cancelar una tanda
# a mitad podría dejar unidades pendientes y desperdiciar presupuesto de la API.
concurrency:
  group: futstats-production-sync
  cancel-in-progress: false

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ejecutar tandas de sincronización
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 10); do
            echo "--- tanda $i ---"

            if ! RESP=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              --max-time 55 \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
              -H "Content-Type: application/json" \
              "${{ secrets.APP_URL }}/api/admin/sync/run" \
              -d '{"maxRequests":200}'); then
              echo "::error::El endpoint de sincronización devolvió un error HTTP o agotó el tiempo máximo."
              exit 1
            fi

            echo "$RESP"
            case "$RESP" in
              *'"stopped":"completed"'*)
                echo "Todo sincronizado."
                break
                ;;
              *'"stopped":"budget_exhausted"'*)
                echo "Presupuesto diario agotado."
                break
                ;;
            esac

            sleep 10
          done
