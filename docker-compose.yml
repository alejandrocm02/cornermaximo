# Solo para desarrollo local. En producción (coste 0€): Neon + Upstash.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cornermaximo
      POSTGRES_PASSWORD: cornermaximo
      POSTGRES_DB: cornermaximo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
